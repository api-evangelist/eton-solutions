summary: >-
  Eton Solutions publishes a genuine, named certification and compliance posture for the
  AtlasFive platform — an unusually complete one for a private wealth-technology vendor,
  including ISO/IEC 42001 for AI management. It publishes no technical API conformance
  claims at all, because it runs no public API program: there is no public OpenAPI,
  AsyncAPI, GraphQL, MCP or A2A surface against which OAuth 2.0, OpenID Connect, RFC 9457
  or pagination/idempotency conventions could be asserted. The two halves of this file
  reflect that split — organizational compliance is strong and evidenced; API-standards
  conformance is simply undetermined rather than failed.
